<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mahasiswa Runner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>🎓 MAHASISWA RUNNER</h1>
    <p>Lari dari buku, laptop, tugas, dosen &amp; revisi. Siapa yang paling kuat bertahan?</p>
  </header>

  <div class="modes" role="group" aria-label="Mode">
    <button id="m1">1 Pemain</button>
    <button id="m2" class="on">2 Pemain</button>
  </div>

  <div class="hud">
    <div class="card p1"><span>P1</span><b id="s1">00000</b></div>
    <div class="card hi"><span>REKOR</span><b id="hi">00000</b></div>
    <div class="card p2" id="card2"><span>P2</span><b id="s2">00000</b></div>
  </div>

  <div class="stage">
    <canvas id="c" width="800" height="400"></canvas>
    <div id="overlay">
      <h2 id="ot">Siap kuliah?</h2>
      <p id="op">Tekan Spasi / Enter atau tombol di bawah</p>
      <button id="go">▶ MULAI</button>
    </div>
  </div>

  <div class="pad">
    <div><button id="p1j" class="b1">P1 ⬆ Lompat</button><button id="p1d" class="b1">P1 ⬇ Tunduk</button></div>
    <div id="pad2"><button id="p2j" class="b2">P2 ⬆ Lompat</button><button id="p2d" class="b2">P2 ⬇ Tunduk</button></div>
  </div>

  <p class="keys"><span class="k1">P1 (biru)</span>: W / Spasi = lompat, S = tunduk
  &nbsp;·&nbsp; <span class="k2">P2 (merah)</span>: ↑ = lompat, ↓ = tunduk</p>
</main>
<script src="game.js"></script>
</body>
</html>
